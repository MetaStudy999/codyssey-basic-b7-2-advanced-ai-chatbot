<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>B7-2 AI Chatbot Reference</title>
  <style>
    body{font-family:sans-serif;max-width:1000px;margin:auto;padding:24px;line-height:1.5} section{border:1px solid #ddd;padding:16px;margin:16px 0} form{display:grid;gap:8px;margin:8px 0} input,textarea,button{font:inherit;padding:8px} textarea{min-height:90px}.row{display:flex;gap:8px;flex-wrap:wrap}.hidden{display:none}.message{border-left:4px solid #ccc;padding:8px;margin:8px 0;white-space:pre-wrap}.error{color:#b00020;font-weight:700}.post{border-top:1px solid #ddd;padding:12px 0}
  </style>
</head>
<body>
  <h1>B7-2 AI 챗봇 + 게시판</h1>
  <p id="status">비로그인 상태입니다.</p>
  <p id="error" class="error"></p>

  <section id="auth-section">
    <h2>회원가입</h2>
    <form id="signup-form">
      <input name="email" type="email" placeholder="email" required>
      <input name="username" placeholder="username" required>
      <input name="password" type="password" minlength="8" placeholder="password" required>
      <button>회원가입</button>
    </form>
    <h2>로그인</h2>
    <form id="login-form">
      <input name="email" type="email" placeholder="email" required>
      <input name="password" type="password" placeholder="password" required>
      <button>로그인</button>
    </form>
  </section>

  <section id="account-section" class="hidden">
    <div class="row"><strong id="me"></strong><button id="logout-button">로그아웃</button></div>
  </section>

  <section id="chat-section" class="hidden">
    <h2>내 AI 대화</h2>
    <form id="session-form"><input name="title" placeholder="새 대화 제목" required><button>새 대화</button></form>
    <div class="row"><select id="sessions"></select><button id="load-messages">대화 열기</button></div>
    <div id="messages"></div>
    <form id="message-form"><textarea name="content" placeholder="AI에게 보낼 메시지" required></textarea><button>전송</button></form>
  </section>

  <section id="posts-section">
    <h2>게시판</h2>
    <form id="post-form" class="hidden"><input name="title" placeholder="제목" required><textarea name="content" placeholder="내용" required></textarea><button>게시글 작성</button></form>
    <button id="reload-posts">게시글 새로고침</button>
    <div id="posts"></div>
  </section>

  <script src="/app.js" defer></script>
</body>
</html>
